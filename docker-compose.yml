# Sobe o FinSight completo: MongoDB + API + front-end
#   docker compose up --build
#   front-end: http://localhost:8080   |   API: http://localhost:8000/docs
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: finsight
      JWT_SECRET: ${JWT_SECRET:-troque-por-um-texto-longo-e-aleatorio-com-32-caracteres}
      CORS_ORIGINS: http://localhost:8080,http://localhost:5173
      BRAPI_TOKEN: ${BRAPI_TOKEN:-}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-Demo@2026}
    ports:
      - "8000:8000"
    depends_on:
      mongo:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  mongo_data:
